# Declarative local demo identities, OIDC application and access policy.
version: 1
metadata:
  name: Pulumi onboarding
entries:
  - model: authentik_core.group
    id: members
    identifiers:
      name: onboarding-members
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice Onboarding
      email: alice@onboarding.example.test
      is_active: true
      groups:
        - !KeyOf members
      password: !Env ALICE_PASSWORD
  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob Outside
      email: bob@onboarding.example.test
      is_active: true
      groups: []
      password: !Env BOB_PASSWORD
  - model: authentik_providers_oauth2.scopemapping
    id: local-email
    identifiers:
      name: Onboarding administratively verified local email
    attrs:
      scope_name: email
      description: Local demonstration identity
      expression: |
        # These two local identities are provisioned by the operator, not enrollment.
        return {"email": request.user.email, "email_verified": request.user.username in ("alice", "bob")}
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: onboarding
    attrs:
      client_type: confidential
      client_id: onboarding
      client_secret: !Env OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:4180/oauth2/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [managed, goauthentik.io/crypto/jwt-managed]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf local-email
      issuer_mode: per_provider
      access_token_validity: minutes=5
  - model: authentik_core.application
    id: application
    identifiers:
      slug: onboarding
    attrs:
      name: Team onboarding
      provider: !KeyOf provider
      meta_launch_url: http://localhost:4180/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      order: 0
    attrs:
      group: !KeyOf members
      enabled: true
